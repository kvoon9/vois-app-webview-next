server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /v2/ {
    proxy_pass https://api.voischat.cn;
    proxy_ssl_server_name on;
    proxy_set_header Host api.voischat.cn;
  }

  location = /vois-app-webview-next {
    return 301 /vois-app-webview-next/;
  }

  location /vois-app-webview-next/ {
    alias /usr/share/nginx/html/;
    index index.html;
  }

  location / {
    return 404;
  }
}
