packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalogs:
  vue:
    '@pinia/colada': ^1.4.6
    '@vue/runtime-vapor': 3.6.0-rc.9
    '@vueuse/core': ^15.0.0
    '@vueuse/integrations': ^15.0.0
    '@vueuse/router': ^15.0.0
    pinia: ^4.0.3
    reka-ui: ^2.10.5
    vue: 3.6.0-rc.9
    vue-i18n: ^11.4.12
    vue-router: ^5.3.1
  build:
    '@unocss/reset': ^66.10.5
    '@vitejs/plugin-legacy': ^8.2.3
    '@vitejs/plugin-vue': ^6.0.9
    terser: ^5.51.2
    unocss: ^66.10.5
    vite: npm:@voidzero-dev/vite-plus-core@0.3.0
    vite-plugin-vue-devtools: ^8.2.1
    vitest: 4.1.9
  tooling:
    '@oxlint/plugins': 1.86.0
    '@types/node': ^26.6.3
    eslint-plugin-slop: ^0.1.3
    taze: ^21.2.0
    typescript: ^7.0.2
    vite-plus: 0.3.0
overrides:
  vite: 'catalog:build'
  vitest: 'catalog:build'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
allowBuilds:
  core-js: true
  esbuild: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@vue/compiler-core@3.6.0-rc.9'
  - '@vue/compiler-dom@3.6.0-rc.9'
  - '@vue/compiler-sfc@3.6.0-rc.9'
  - '@vue/compiler-ssr@3.6.0-rc.9'
  - '@vue/reactivity@3.6.0-rc.9'
  - '@vue/runtime-core@3.6.0-rc.9'
  - '@vue/runtime-dom@3.6.0-rc.9'
  - '@vue/runtime-vapor@3.6.0-rc.9'
  - '@vue/server-renderer@3.6.0-rc.9'
  - '@vue/shared@3.6.0-rc.9'
  - vue@3.6.0-rc.9
  - '@vue/compiler-vapor@3.6.0-rc.9'
  - vite-plugin-vois-webview-debug@0.1.0
  - '@vois/webview-bridge@0.5.1'
catalog:
  '@amap/amap-jsapi-loader': ^1.0.1
  '@formatjs/intl-displaynames': ^7.3.15
  '@formatjs/intl-locale': ^5.3.12
  '@iconify-json/ph': ^1.2.2
  '@internationalized/date': ^3.12.4
  '@vois/webview-bridge': ^0.5.1
