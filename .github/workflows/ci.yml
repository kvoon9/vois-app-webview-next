name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm exec vp check && pnpm exec vp test
