packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalogs:
  vue:
    '@pinia/colada': ^1.4.9
    '@ui-sdk/core': 0.1.0-beta.13
    '@ui-sdk/vue': 0.1.0-beta.13
    '@vue/runtime-vapor': 3.6.0-rc.9
    '@vueuse/core': ^15.0.0
    '@vueuse/integrations': ^15.0.0
    '@vueuse/router': ^15.0.0
    pinia: ^4.1.0
    reka-ui: ^2.11.0
    vue: 3.6.0-rc.9
    vue-i18n: ^11.4.20
    vue-router: ^5.5.1
  build:
    '@unocss/reset': ^66.13.0
    '@vitejs/plugin-legacy': ^8.2.4
    '@vitejs/plugin-vue': ^6.0.11
    terser: ^5.51.2
    unocss: ^66.13.0
    vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
    vite-plugin-vue-devtools: ^8.2.1
  tooling:
    '@commitlint/config-conventional': ^21.2.4
    commitlint: ^21.2.4
    '@types/node': ^26.6.6
    eslint-plugin-slop: ^0.1.3
    taze: ^21.3.0
    tsrs: 7.1.0-beta.tsrs2
    typescript: ^7.0.2
    vite-plus: 1.7.0
    vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  docs:
    '@iconify-json/lucide': ^1.2.155
    '@nuxt/content': ^3.16.2
    '@nuxt/ui': ^4.12.0
    better-sqlite3: ^13.2.0
    nuxt: ^4.6.4
    tailwindcss: ^4.3.5
    vue: 3.5.43
overrides:
  vite@*: catalog:build
  # The UI SDK's Vue package peers on core with a caret range; a second copy
  # breaks popup anchor names (vercel-labs/ui#932), so core stays exact.
  '@ui-sdk/core': 0.1.0-beta.13
allowBuilds:
  better-sqlite3: true
  core-js: true
  esbuild: true
  vue-demi: true
  workerd: true
minimumReleaseAgeExclude:
  - '@ui-sdk/core@0.1.0-beta.13'
  - '@ui-sdk/vue@0.1.0-beta.13'
  - '@vue/compiler-core@3.6.0-rc.9'
  - '@vue/compiler-dom@3.6.0-rc.9'
  - '@vue/compiler-sfc@3.6.0-rc.9'
  - '@vue/compiler-ssr@3.6.0-rc.9'
  - '@vue/reactivity@3.6.0-rc.9'
  - '@vue/runtime-core@3.6.0-rc.9'
  - '@vue/runtime-dom@3.6.0-rc.9'
  - '@vue/runtime-vapor@3.6.0-rc.9'
  - '@vue/server-renderer@3.6.0-rc.9'
  - '@vue/shared@3.6.0-rc.9'
  - vue@3.6.0-rc.9
  - '@vue/compiler-vapor@3.6.0-rc.9'
  - vite-plugin-vois-webview-debug@0.1.0
  - '@vois/webview-bridge@0.6.0'
  - '@iconify-json/lucide@1.2.143'
  - '@nuxt/content@3.16.2'
  - '@voidzero-dev/vite-plus-core@8.3.8000'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.7.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.7.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.7.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.7.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.7.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.7.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.7.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.7.0'
  - vite-plus@1.7.0
catalog:
  '@amap/amap-jsapi-loader': ^1.0.1
  '@formatjs/intl-displaynames': ^8.0.3
  '@formatjs/intl-locale': ^5.4.3
  '@iconify-json/ph': ^1.2.2
  '@internationalized/date': ^3.12.4
  '@vois/webview-bridge': ^0.6.0
  '@x18n/cli': ^0.1.14
  '@x18n/core': ^0.1.14
  pinyin-pro: ^3.29.5
  wrangler: ^4.162.0
